# ============================================
# Kubernetes Service - Next.js Portfolio
# ============================================
# Type:       NodePort (Minikube browser access)
# TargetPort: 3000 (container port)
# NodePort:   30080 (host access port)
# ============================================

apiVersion: v1
kind: Service
metadata:
  name: portfolio-service
  labels:
    app: portfolio
spec:
  type: NodePort
  selector:
    app: portfolio
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
      nodePort: 30080
